<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>ESP32 消息交互控制台</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 30px; background: #f5f7fa; color: #333; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        #connectBtn { background-color: #4CAF50; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #onBtn { background-color: #2196F3; color: white; }
        #offBtn { background-color: #f44336; color: white; }
        #status { margin-top: 15px; font-weight: bold; color: #666; }
        .hidden { display: none; }
        
        /* 终端监视器 UI 样式 */
        .terminal-container { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 25px auto; width: 90%; }
        .log-box { background: #1e1e1e; color: #a9b7c6; border-radius: 8px; padding: 15px; text-align: left; height: 180px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .log-title { font-weight: bold; text-align: left; margin-bottom: 5px; font-size: 14px; color: #555; display: flex; justify-content: space-between; }
        .log-in { color: #4ec9b0; }  /* 接收到的消息为青色 */
        .log-out { color: #ce9178; } /* 发送出去的消息为橙色 */
        .clear-btn { background: #ccc; color: #333; padding: 2px 8px; font-size: 11px; margin: 0; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>ESP32 消息交互控制台 🎮</h1>
    
    <button id="connectBtn">搜索并连接 ESP32</button>
    <div id="status">状态: 未连接</div>
    
    <div id="controlPanel" class="hidden">
        <button id="onBtn">💡 开灯 (发 1)</button>
        <button id="offBtn">🌑 关灯 (发 0)</button>

        <div class="terminal-container">
            <div>
                <div class="log-title">📥 接收消息监视器 (ESP32 -> 网页) <button class="clear-btn" onclick="clearLog('rxLog')">清空</button></div>
                <div id="rxLog" class="log-box"></div>
            </div>
            <div>
                <div class="log-title">📤 发送历史记录 (网页 -> ESP32) <button class="clear-btn" onclick="clearLog('txLog')">清空</button></div>
                <div id="txLog" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bluetoothDevice;
        let controlCharacteristic;

        const connectBtn = document.getElementById('connectBtn');
        const onBtn = document.getElementById('onBtn');
        const offBtn = document.getElementById('offBtn');
        const statusDiv = document.getElementById('status');
        const controlPanel = document.getElementById('controlPanel');
        
        const rxLog = document.getElementById('rxLog');
        const txLog = document.getElementById('txLog');

        // 连接蓝牙逻辑
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "状态: 正在请求设备...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_BLE_Demo' }],
                    optionalServices: [SERVICE_UUID] 
                });

                statusDiv.innerText = "状态: 正在建立连接...";
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                controlCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "状态: 🎉 连接成功！";
                statusDiv.style.color = "green";
                
                connectBtn.classList.add('hidden');
                controlPanel.classList.remove('hidden');

                // 【核心功能】：开启 Notify 监听，接收来自 ESP32 的主动推送
                await controlCharacteristic.startNotifications();
                controlCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
                
                logMessage(rxLog, "成功订阅 ESP32 推送服务...", "log-in");
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "状态: 连接失败 (" + error + ")";
                statusDiv.style.color = "red";
            }
        });

        // 处理从 ESP32 接收到的通知 (Notify)
        function handleNotifications(event) {
            let value = event.target.value;
            // 将接收到的 DataView 字节流解码为 UTF-8 字符串（支持中文）
            let decoder = new TextDecoder('utf-8');
            let message = decoder.decode(value);
            
            logMessage(rxLog, message, "log-in");
        }

        // 发送数据到 ESP32
        async function sendCommand(command) {
            if (!controlCharacteristic) return;
            try {
                let encoder = new TextEncoder();
                await controlCharacteristic.writeValue(encoder.encode(command));
                
                logMessage(txLog, `成功写入指令: ${command}`, "log-out");
            } catch (error) {
                console.error(error);
                logMessage(txLog, `❌ 发送失败: ${command}`, "log-out");
            }
        }

        onBtn.addEventListener('click', () => sendCommand('1'));
        offBtn.addEventListener('click', () => sendCommand('0'));

        // 辅助函数：向黑框监视器里打印带时间戳的消息
        function logMessage(element, msg, cssClass) {
            let timeStr = new Date().toLocaleTimeString();
            element.innerHTML += `<div class="${cssClass}">[${timeStr}] ${msg}</div>`;
            // 自动滚动到最底部
            element.scrollTop = element.scrollHeight;
        }

        // 清空日志
        function clearLog(id) {
            document.getElementById(id).innerHTML = "";
        }

        function onDisconnected() {
            statusDiv.innerText = "状态: ❌ 设备已断开";
            statusDiv.style.color = "red";
            connectBtn.classList.remove('hidden');
            controlPanel.classList.add('hidden');
        }
    </script>
</body>
</html>
